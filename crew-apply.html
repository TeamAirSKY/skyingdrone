<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070809"><title>크루 지원하기 | AIR SKY</title><link rel="icon" href="assets/air-sky.jpg"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap"><link rel="stylesheet" href="assets/forms.css"><script defer src="assets/crew-apply.js"></script></head><body>
<header class="header"><a href="/" aria-label="AIR SKY 홈"><img src="assets/air-sky-wordmark.svg" alt="AIR SKY"></a><a href="crew.html">크루 소개로 ↗</a></header><main class="page"><p class="eyebrow">JOIN THE CREW</p><h1>함께할 당신을<br>소개해주세요.</h1><p class="lead">이름이나 닉네임, 희망 부서와 짧은 소개를 남겨주세요.</p>
<div class="notice" id="intake-notice" hidden role="status"></div><form id="crew-apply-form"><div class="field"><label for="name">이름 또는 닉네임</label><input id="name" name="name" required maxlength="30" autocomplete="nickname" placeholder="어떤 이름으로 불러드릴까요?"></div><div class="field"><label for="department">희망 부서</label><select id="department" name="department" required><option value="">부서를 선택해주세요</option><option value="filming">촬영팀</option><option value="planning">기획팀</option><option value="editing">편집팀</option><option value="undecided">아직 정하지 않았어요</option></select></div><div class="field"><label for="introduction">간단한 소개</label><textarea id="introduction" name="introduction" required maxlength="1000" placeholder="좋아하는 일이나 함께하고 싶은 작업을 편하게 알려주세요."></textarea><p class="hint">전화번호 등 불필요한 개인정보는 적지 말아주세요.</p></div><div class="trap" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div><label class="consent"><input id="agreed" type="checkbox" required><span>크루 지원 검토를 위해 이름(닉네임), 희망 부서, 소개, 접수 시각과 처리 상태를 수집·이용하는 데 동의합니다. 접수일부터 180일 보관하며 이후 일일 정리 작업으로 삭제합니다. <a href="privacy.html">개인정보 처리방침</a></span></label><button class="button submit" type="submit" disabled>크루 지원하기</button><p class="message" id="form-message" role="status" aria-live="polite"></p></form><section class="success" id="success" hidden><h2>지원을 받았습니다.</h2><p>남겨주신 소개를 검토하겠습니다.<br>접수는 합류 확정을 의미하지 않습니다.</p><p>접수 번호 <span class="receipt" id="receipt"></span></p><a class="map-link" id="receipt-status-link" href="receipt.html">접수 결과 확인하기 ↗</a><br><a class="map-link" href="crew.html">크루 소개로 돌아가기 ↗</a></section><a class="map-link" href="receipt.html#kind=crew">이미 지원했나요? 접수 결과 확인 ↗</a></main><footer class="footer">© 2026 AIR SKY</footer></body></html>
