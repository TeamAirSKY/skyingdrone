<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#070809"><title>관리자 | AIR SKY</title><link rel="icon" href="assets/air-sky.jpg"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap"><link rel="stylesheet" href="assets/forms.css"><script defer src="assets/admin.js"></script><script defer src="assets/admin-suggestions.js"></script><script defer src="assets/admin-audit.js"></script></head><body><header class="header"><a href="index.html" aria-label="AIR SKY 홈"><img src="assets/air-sky-wordmark.svg" alt="AIR SKY"></a><a href="index.html">홈으로 ↗</a></header><main class="page admin-page"><p class="eyebrow">AIR SKY ADMIN</p><h1>관리자 페이지</h1><section id="login-section" class="login"><p class="lead">관리자 비밀번호를 입력해주세요.</p><p class="audit-notice" id="access-notice" role="status">접속 기기 정보와 로그인 결과가 기록됩니다.</p><form id="login-form"><div class="field"><label for="pin">6자리 비밀번호</label><input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="current-password" required aria-describedby="login-message"></div><button class="button submit" type="submit">로그인</button></form></section><section id="dashboard" hidden><div class="admin-tabs" role="tablist" aria-label="접수 종류"><button class="admin-tab" id="filming-tab" role="tab" aria-selected="true" aria-controls="filming-panel">촬영 신청</button><button class="admin-tab" id="suggestion-tab" role="tab" aria-selected="false" aria-controls="suggestion-panel">건의사항</button></div><div id="filming-panel" role="tabpanel" aria-labelledby="filming-tab"><div class="admin-toolbar"><p class="status-label">최근 신청부터 표시합니다.</p><div class="row"><button class="button secondary" id="refresh">새로고침</button><button class="button secondary" id="logout">로그아웃</button></div></div><div id="requests"></div><button class="button secondary" id="load-more" hidden>더 보기</button></div><div id="suggestion-panel" role="tabpanel" aria-labelledby="suggestion-tab" hidden><div class="admin-toolbar"><label for="suggestion-filter">건의 대상</label><select id="suggestion-filter"><option value="all">전체</option><option value="site">사이트</option><option value="channel">채널</option></select><button class="button secondary" id="refresh-suggestions">새로고침</button><button class="button secondary" id="logout-suggestions">로그아웃</button></div><div id="suggestion-list"></div><button class="button secondary" id="more-suggestions" hidden>더 보기</button><p class="message" id="suggestion-message" role="status"></p></div><section class="audit-section" aria-labelledby="audit-title"><div class="admin-toolbar"><div><h2 id="audit-title">접속 기록</h2><p class="hint">서버에 누적되는 읽기 전용 기록입니다. 이 페이지에서 수정·삭제할 수 없습니다.</p><p class="hint">기기 ID는 브라우저 기준이며, 쿠키를 삭제하거나 다른 브라우저를 쓰면 달라질 수 있습니다.</p></div><button class="button secondary" id="refresh-audit">새로고침</button></div><div id="audit-list"></div><button class="button secondary" id="more-audit" hidden>더 보기</button><p class="message" id="audit-message" role="status"></p></section></section><p class="message" id="login-message" role="status" aria-live="polite"></p></main><footer class="footer">© 2026 AIR SKY</footer></body></html>
