<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>접수 결과 확인 | AIR SKY</title><link rel="icon" href="assets/air-sky.jpg"><link rel="stylesheet" href="assets/forms.css"><script defer src="assets/receipt.js"></script></head><body><header class="header"><a href="/" aria-label="AIR SKY 홈"><img src="assets/air-sky-wordmark.svg" alt="AIR SKY"></a><a href="/">홈으로 ↗</a></header><main class="page"><p class="eyebrow">REQUEST STATUS</p><h1>접수 결과 확인</h1><p class="lead">촬영 신청 번호와 확인용 비밀번호로 검토 상태를 확인해주세요.<br>개인정보와 관리자 메모는 표시하지 않습니다.</p><form id="receipt-form"><input type="hidden" id="kind" name="kind" value="filming"><div class="field"><label for="receipt-id">접수 번호</label><input id="receipt-id" name="id" required maxlength="36" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="접수 번호를 입력해주세요"></div><div class="field" id="receipt-pin-field"><label for="receipt-pin">확인용 비밀번호 · 숫자 4자리</label><input id="receipt-pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" required autocomplete="off"></div><button class="button submit" type="submit">결과 확인하기</button><p class="message" id="receipt-message" role="status" aria-live="polite"></p></form><section class="success" id="receipt-result" hidden aria-live="polite"><p class="eyebrow">현재 처리 상태</p><h2 id="receipt-status"></h2><p id="receipt-description"></p></section><p class="hint">신청 번호와 비밀번호를 함께 보관해주세요. 다른 사람에게 공유하지 말고 보관해주세요. 180일 보관 기간이 지난 접수는 조회할 수 없습니다.</p></main><footer class="footer">© 2026 AIR SKY</footer></body></html>
